[project]
name = "MangaReaderScraper"
dynamic = ["version"]
description = "Search & download mangas from the command line"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "superDross", email = "dross78375@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "beautifulsoup4",
    "cloudscraper",
    "curl_cffi",
    "lxml",
    "nodriver",
    "Pillow",
    "reportlab",
    "requests",
    "rich",
    "tabulate",
]

[project.optional-dependencies]
# Cloud upload backends. Quarantined behind an extra (see refactoring-plan §5.4):
# `uv sync --extra upload` or `pip install .[upload]`.
upload = [
    "dropbox",
    "pcloud",
]

[project.scripts]
manga-scraper = "scraper.__main__:cli_entry"

[project.urls]
Homepage = "https://github.com/superDross/MangaReaderScraper"

[dependency-groups]
# Dev tooling, installed by default with `uv sync`.
# Includes the `upload` extra so the existing upload tests keep running until
# they are tiered into opt-in integration tests (plan §5.7).
dev = [
    "ruff>=0.10",
    "mypy",
    "mypy-extensions",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "click",
    "MangaReaderScraper[upload]",
]

[build-system]
requires = ["setuptools>=70.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scraper", "scraper.parsers", "scraper.uploaders"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort -- replaces flake8 + pyflakes + isort.
select = ["E", "F", "I", "W"]
# E203 (whitespace before ':') and E501 (line length) conflict with / are owned
# by the formatter; E701 (multiple statements) was already ignored in the old
# flake8 config.
ignore = ["E203", "E501", "E701"]

[tool.ruff.lint.isort]
known-third-party = ["tabulate", "bs4", "requests", "pytest", "urllib3"]

[tool.pytest.ini_options]
# Only collect the real suite. Without this, a bare `pytest` collects from the
# rootdir and would import any stray test-pattern script elsewhere in the tree
# (e.g. a scratch probe file at the repo root that launches a browser at import).
testpaths = ["tests"]
# A per-test timeout so a mis-targeted mock that falls through to a real network
# call fails fast instead of hanging CI (see refactoring-plan §5.7). Tune as needed.
addopts = "--cov scraper --timeout=60"
log_cli = true
log_cli_level = "WARN"
markers = [
    "integration: tests that touch a real browser/network (deselect with -m 'not integration'). None yet -- the suite is fully mocked.",
    "real_pool: opt out of the mocked_pool_imap fixture and run MangaBuilder's real multiprocessing Pool (verifies the parent assembles pages from worker return values under spawn).",
]

[tool.mypy]
check_untyped_defs = true
# strict optional is ON (mypy default) so None-returns are type errors. All
# parsers now comply; the Wave C "fix-or-retire" exemptions are gone (mangapark/
# mangareader/mangafast retired, mangago rewritten under strict optional).

[[tool.mypy.overrides]]
module = [
    "dropbox.*",
    "bs4.*",
    "urllib3.*",
    "PIL",
    "reportlab.*",
    "pcloud",
    "setuptools",
    "curl_cffi.*",
]
ignore_missing_imports = true

# nodriver ships a cdp module with a non-UTF-8 byte that crashes mypy's parser
# (the "UTF-in-comment" issue noted in refactoring-plan §5.5). Skip following
# imports into it; we only type-check our own code.
[[tool.mypy.overrides]]
module = ["nodriver.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
