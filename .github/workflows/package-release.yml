name: MangaReaderScraper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra upload

      - name: Lint (ruff)
        run: uv run ruff check ./scraper ./tests

      - name: Format check (ruff)
        run: uv run ruff format --check ./scraper ./tests

      - name: Type check (mypy)
        # Non-blocking: the bs4 upgrade surfaced latent type errors in the
        # parsers (Tag.get() typed as str | AttributeValueList). Kept visible so
        # the count trends down, not up.
        continue-on-error: true
        run: uv run mypy scraper

      - name: Tests
        run: uv run pytest
