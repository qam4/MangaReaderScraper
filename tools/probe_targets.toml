# Probe targets for the C2 re-probe (fix-or-retire) sweep.
#
# One [[site]] per source, with up to three stage URLs:
#   chapters - a manga/series page (lists chapters)
#   images   - a reader/chapter page (the page images)
#   search   - the parser's ACTUAL search URL (see note below)
#
# The URLs were derived from each parser's CURRENT url-building code
# (_manga_page_url / volume_url / all_volume_ids and the search parsers' search
# URLs), so they match exactly what the parser would hit. Swap in a different
# series if one of these has since been removed from a site.
#
# search vs search_query:
#   * Most parsers GET a concrete search URL (e.g. /search/story/<q>,
#     /r/l_search/?name=<q>, ?s=<q>, api/titles/search?q=<q>). For those, put
#     that real URL in `search` and OMIT search_query -- the probe just loads it.
#   * A few sites have no plain search URL and drive a JS search box instead
#     (mangafire intercepts ajax/manga/search). For those, point `search` at the
#     page with the box and set search_query -- the probe types it in.
#
# Rules:
#   * Leave a URL as "" to SKIP that stage.
#   * Any URL containing "TODO" is skipped with a warning.
#   * The runner forces probe_out/<name>/<stage>/, so stages never collide.
#
# Then:  uv run python tools/probe_batch.py run
#        uv run python tools/probe_batch.py summary

[[site]]
name = "mangabuddy"  # mangak.io, API-backed
chapters = "https://mangak.io/naruto"
images = "https://mangak.io/naruto/chapter-700-5-uzumaki-naruto"
search = "https://api.mangak.io/titles/search?q=naruto"

[[site]]
name = "mangafast"
chapters = "https://mangafast.net/dragon-ball-super?order=old#table"
images = "https://mangafast.net/dragon-ball-super-chapter-1"
search = "https://mangafast.net/?s=naruto"

[[site]]
name = "mangafire"  # search is a JS box + ajax/manga/search XHR -> interactive
chapters = "https://mangafire.to/manga/ad-astra-scipio-and-hanniball.lww3"
images = "https://mangafire.to/read/ad-astra-scipio-and-hanniball.lww3/en/chapter-1"
search = "https://mangafire.to"
search_query = "naruto"

[[site]]
