# Probe targets for the C2 re-probe (fix-or-retire) sweep.
#
# One [[site]] per source, with up to three stage URLs:
#   chapters - a manga/series page (lists chapters)
#   images   - a reader/chapter page (the page images)
#   search   - the page the search box lives on (usually home); the term to
#              search for goes in `search_query`
#
# The URLs below were derived from each parser's CURRENT url-building code
# (_manga_page_url / volume_url / all_volume_ids) using a known sample slug, so
# they match exactly what the parser would hit. Swap in a different series if
# one of these has since been removed from a site.
#
# Rules:
#   * Leave a URL as "" to SKIP that stage.
#   * Any URL containing "TODO" is skipped with a warning.
#   * The batch runner forces each run into probe_out/<name>/<stage>/, so stages
#     never overwrite each other (no reliance on URL heuristics).
#
# Then:  uv run python tools/probe_batch.py run
#        uv run python tools/probe_batch.py summary

[[site]]
name = "mangabuddy"  # mangak.io, API-backed
chapters = "https://mangak.io/naruto"
images = "https://mangak.io/naruto/chapter-700-5-uzumaki-naruto"
search = "https://mangak.io"
search_query = "naruto"

